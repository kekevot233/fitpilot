server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React currently renders a single-page application. Unknown browser routes
    # therefore fall back to index.html instead of returning an Nginx 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The browser only sees one origin. Nginx resolves the backend service name
    # on Docker's private network and forwards API requests to Spring Boot.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
