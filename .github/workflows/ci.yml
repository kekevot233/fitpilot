name: CI

on:
  # Run for substantial updates on demand, rather than every small push or PR.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests and PostgreSQL/Redis integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Java 21 and Maven cache
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Verify Docker is available for Testcontainers
        run: docker info

      # Surefire runs the fast tests; Failsafe runs *IT and fails verify on errors.
      # Testcontainers owns its temporary PostgreSQL/Redis containers and cleanup.
      - name: Run backend tests and Testcontainers integration tests
        run: mvn --batch-mode --no-transfer-progress -Pintegration-tests verify

      - name: Upload backend test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/failsafe-reports/
          if-no-files-found: warn
          retention-days: 14

  frontend:
    name: Frontend Vitest and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js 22 and npm cache
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        id: install
        run: npm ci

      - name: Run Vitest
        run: npm test -- --reporter=default --reporter=junit --outputFile.junit=test-results/vitest.xml

      - name: Build production frontend
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run build

      - name: Upload frontend test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: frontend-test-reports
          path: web/test-results/vitest.xml
          if-no-files-found: warn
          retention-days: 14

  end-to-end:
    name: Playwright end-to-end
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      FITPILOT_DB_PASSWORD: fitpilot-ci-database-password
      JWT_SECRET: fitpilot-ci-jwt-secret-with-at-least-thirty-two-characters
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Node.js 22 and npm cache
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked frontend dependencies
        working-directory: web
        run: npm ci

      - name: Install Chromium, Firefox, and system dependencies
        working-directory: web
        run: npx playwright install --with-deps chromium firefox

      - name: Build and start the production deployment topology
        run: docker compose -f compose.deploy.yaml up --build --detach --wait --wait-timeout 180

      - name: Run Playwright against the production image, PostgreSQL and Redis
        working-directory: web
        run: npm run test:e2e

      - name: Capture Compose logs on failure
        if: ${{ failure() }}
        run: |
          mkdir -p web/test-results
          docker compose -f compose.deploy.yaml ps --all > web/test-results/compose-status.txt
          docker compose -f compose.deploy.yaml logs --no-color > web/test-results/compose.log

      - name: Upload Playwright report and diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: playwright-report
          path: |
            web/playwright-report/
            web/test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop application and remove the CI data volumes
        if: ${{ always() }}
        run: docker compose -f compose.deploy.yaml down --volumes --remove-orphans
