# yaml-language-server: $schema=https://render.com/schema/render.yaml.json

services:
  - type: web
    name: fitpilot-demo-zhengyi
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fitpilot-db
          property: connectionString
      - key: DB_NAME
        fromDatabase:
          name: fitpilot-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: fitpilot-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: fitpilot-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ISSUER
        value: https://fitpilot-demo-zhengyi.onrender.com
      - key: JWT_EXPIRATION_MINUTES
        value: "1440"

databases:
  - name: fitpilot-db
    plan: free
    postgresMajorVersion: "17"
    databaseName: fitpilot
    user: fitpilot
    ipAllowList: []