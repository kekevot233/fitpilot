spring:
  application:
    name: fitpilot-backend
  datasource:
    # Environment variables keep local credentials out of Git.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fitpilot}
    username: ${DB_USERNAME:fitpilot}
    password: ${DB_PASSWORD:fitpilot}
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      connect-timeout: 1s
      timeout: 2s
  jpa:
    hibernate:
      # Flyway owns schema changes; Hibernate only checks that entities still match the database.
      ddl-auto: validate
    open-in-view: false
  flyway:
    # Existing local databases already match V3. Flyway records that baseline without replaying it.
    # Empty databases still execute V1 -> V2 -> V3 normally.
    baseline-on-migrate: true
    baseline-version: 3
    baseline-description: Hibernate schema before Flyway

server:
  forward-headers-strategy: none
  # Render and similar platforms provide PORT. SERVER_PORT remains available
  # for local or self-hosted overrides.
  port: ${PORT:${SERVER_PORT:8080}}

management:
  health:
    redis:
      # Redis failure blocks new logins, not existing users' core data access.
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

fitpilot:
  cache:
    food-search:
      enabled: ${FOOD_CACHE_ENABLED:true}
      ttl-seconds: ${FOOD_CACHE_TTL_SECONDS:300}
  ai:
    # OpenAI-compatible Chat Completions API. Keep the key in an environment variable.
    base-url: ${AI_BASE_URL:https://api.deepseek.com}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:deepseek-chat}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:25}
  security:
    login-protection:
      max-failures: ${LOGIN_MAX_FAILURES:5}
      window-seconds: ${LOGIN_WINDOW_SECONDS:900}
      attempt-lease-seconds: ${LOGIN_ATTEMPT_LEASE_SECONDS:30}
      trusted-proxies: ${LOGIN_TRUSTED_PROXIES:}
    jwt:
      issuer: ${JWT_ISSUER:https://fitpilot.local}
      secret: ${JWT_SECRET:fitpilot-local-development-secret-change-before-production-2026}
      expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
